<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Metadados Nativos -->
    <title id="meta-title">POP | Papelaria e Cafeteria em Osvaldo Cruz</title>
    <meta name="description" id="meta-description" content="Papelaria e cafeteria em Osvaldo Cruz. Conheça a POP e fale com nossa equipe.">
    
    <!-- Open Graph (IDs padronizados para o JS) -->
    <meta property="og:type" content="website">
    <meta property="og:title" id="og-title" content="POP | Papelaria e Cafeteria em Osvaldo Cruz">
    <meta property="og:description" id="og-description" content="Papelaria e cafeteria em Osvaldo Cruz. Conheça a POP e fale com nossa equipe.">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:url" id="og-url" content="">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="#" class="logo-link">
                <img id="header-logo" src="" alt="Logotipo" style="display:none;">
                <!-- ID alinhado com o JS: company-name -->
                <span id="company-name" class="company-name"></span>
            </a>
            
            <!-- ID alinhado com o JS: mobile-menu-btn -->
            <button type="button" id="mobile-menu-btn" class="mobile-menu-btn" aria-expanded="false" aria-controls="main-menu" aria-label="Abrir menu">
                <span class="hamburger"></span>
            </button>
            
            <!-- ID alinhado com o JS: main-menu e menu-list -->
            <nav id="main-menu" class="main-menu">
                <ul class="menu-list">
                    <li><a href="#hero">Início</a></li>
                    <li><a href="#servicos">Serviços</a></li>
                    <li><a href="#diferenciais">Diferenciais</a></li>
                    <li><a href="#galeria">Galeria</a></li>
                    <li><a href="#avaliacoes">Avaliações</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="hero" class="hero-section">
            <div class="hero-content">
                <h1 id="hero-title"></h1>
                <p id="hero-text"></p>
                <!-- ID alinhado com o JS: hero-cta -->
                <a id="hero-cta" href="#" class="btn-primary hero-cta" target="_blank" rel="noopener noreferrer" style="display:none;"></a>
            </div>
            <div class="hero-image-container">
                <img id="hero-img" src="" alt="Imagem Principal" style="display:none;">
            </div>
        </section>

        <section id="servicos" class="servicos-section" style="display:none;">
            <div class="container">
                <h2>Nossos Serviços</h2>
                <!-- ID alinhado com o JS: servicos-grid -->
                <div id="servicos-grid" class="servicos-grid"></div>
            </div>
        </section>

        <section id="diferenciais" class="diferenciais-section" style="display:none;">
            <div class="container">
                <h2>Por que nos escolher?</h2>
                <!-- ID alinhado com o JS: diferenciais-grid -->
                <div id="diferenciais-grid" class="diferenciais-grid"></div>
            </div>
        </section>

        <section id="galeria" class="galeria-section" style="display:none;">
            <div class="container">
                <h2>Galeria</h2>
                <!-- ID alinhado com o JS: galeria-grid -->
                <div id="galeria-grid" class="galeria-grid"></div>
            </div>
        </section>

        <section id="avaliacoes" class="avaliacoes-section" style="display:none;">
            <div class="container">
                <h2>O que dizem nossos clientes</h2>
                <!-- ID alinhado com o JS: avaliacoes-grid -->
                <div id="avaliacoes-grid" class="avaliacoes-grid"></div>
            </div>
        </section>

        <section id="contato" class="contato-section">
            <div class="container">
                <h2>Contato</h2>
                <div class="contato-info">
                    <!-- IDs de contato padronizados -->
                    <p id="endereco-container" style="display:none;"><strong class="contato-label">Endereço:</strong> <span id="endereco-text"></span></p>
                    <p id="telefone-container" style="display:none;"><strong class="contato-label">Telefone:</strong> <a id="telefone-link" href="#"></a></p>
                    <p id="whatsapp-container" style="display:none;"><strong class="contato-label">WhatsApp:</strong> <a id="whatsapp-link" href="#" target="_blank" rel="noopener noreferrer"></a></p>
                </div>
                <div id="redes-sociais-container" class="redes-sociais-container"></div>
                <!-- ID alinhado com o JS: mapa-container -->
                <div id="mapa-container" class="mapa-container"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p id="footer-text"></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
